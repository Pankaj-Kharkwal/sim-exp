[project]
name = "pankh-ai-backend"
version = "0.1.0"
description = "Pankh.AI Backend Service - FastAPI-based workflow orchestration platform"
authors = [{ name = "Pankh.AI Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "motor>=3.6.0",
    "structlog>=24.4.0",
    "python-json-logger>=3.2.1",
    "openai>=1.57.0",
    "anthropic>=0.41.0",
    "langgraph>=0.2.60",
    "langchain>=0.3.12",
    "langchain-openai>=0.2.13",
    "langchain-anthropic>=0.3.3",
    "langsmith>=0.3.45",
    "tiktoken>=0.8.0",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "azure-storage-blob>=12.24.0",
    "azure-identity>=1.19.0",
    "boto3>=1.35.76",
    "stripe>=11.2.0",
    "resend>=2.5.0",
    "python-socketio>=5.11.0",
    "kombu>=5.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "black>=24.10.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.build.targets.wheel]
packages = ["app"]
